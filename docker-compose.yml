version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/resumedb
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resumedb
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
